<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Consulting | Next Generation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; overflow-x: hidden; }

        /* スライドショーのコンテナ */
        .slideshow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        /* 各スライドの共通設定 */
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            filter: brightness(0.4); /* 文字を見やすくするために少し暗くします */
        }

        /* 表示中のスライド */
        .slide.active {
            opacity: 1;
        }

        .glow-button {
            transition: all 0.3s ease;
            position: relative;
        }
        .glow-button:hover {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-xl font-bold tracking-tighter text-slate-800">AI CONSULTING</div>
            <nav class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="#about" class="hover:text-sky-500 transition">VISION</a>
                <a href="#services" class="hover:text-sky-500 transition">SERVICES</a>
                <a href="#contact" class="bg-sky-600 text-white px-5 py-2 rounded-full glow-button">お問い合わせ</a>
            </nav>
        </div>
    </header>

    <section class="relative h-screen flex items-center justify-center px-6 overflow-hidden">
        <div class="slideshow-container">
            <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=2000')"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=2000')"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&q=80&w=2000')"></div>
        </div>

        <div class="max-w-4xl mx-auto text-center text-white z-10" data-aos="fade-up" data-aos-duration="1000">
            <h1 class="text-5xl md:text-7xl font-bold mb-8 leading-tight">
                AIを、現場の<br><span class="text-sky-400">「即戦力」</span>へ。
            </h1>
            <p class="text-slate-200 text-lg md:text-xl mb-12 max-w-2xl mx-auto leading-relaxed">
                営業歴8年の現場感覚と、LINEヤフーで体感した「劇的汎化」の知見で、中小企業の未来をアップデートします。
            </p>
            <a href="#contact" class="inline-block bg-sky-500 text-white font-bold px-10 py-4 rounded-full glow-button text-lg">
                無料相談を開始する
            </a>
        </div>
    </section>

    <section id="about" class="py-32 px-6 max-w-6xl mx-auto">
        <div class="grid md:grid-cols-2 gap-20 items-center">
            <div data-aos="fade-right">
                <span class="text-sky-500 font-bold tracking-widest uppercase text-sm">Our Vision</span>
                <h2 class="text-4xl font-bold mt-4 mb-8 leading-tight">AIは、働く人の自由を<br>取り戻すためのもの</h2>
                <p class="text-slate-600 leading-relaxed mb-6">
                    営業現場の最前線で感じた「時間の枯渇」。それを解決したのは、LINEヤフーで目撃したAIによる業務の標準化・汎化でした。
                </p>
                <div class="border-l-4 border-sky-500 pl-6 py-2 bg-slate-100 rounded-r-lg">
                    <p class="text-slate-700 italic">「経営者にはROIを、現場には時間を。」</p>
                </div>
            </div>
            <div class="relative" data-aos="zoom-in">
                <div class="bg-white p-8 rounded-3xl shadow-2xl relative border border-slate-100">
                    <div class="space-y-4">
                        <div class="h-4 bg-slate-100 rounded w-3/4"></div>
                        <div class="h-4 bg-sky-200 rounded w-5/6"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true });

        // スライドショーの制御スクリプト
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(nextSlide, 5000); // 5秒ごとに切り替え
    </script>
</body>
</html>
